<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kagi Translate – API key</title>
    <style>
      :root { color-scheme: light dark; --bg: #fff; --fg: #1c1c1e; --muted: #6b6b70; --line: #d8d8dc; --accent: #ffb319; --ok: #1a7f37; --err: #cf222e; }
      @media (prefers-color-scheme: dark) { :root { --bg: #232325; --fg: #f2f2f4; --muted: #a0a0a8; --line: #3a3a3e; --ok: #56d364; --err: #ff7b72; } }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
      main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p.muted, small { color: var(--muted); }
      label.row { display: flex; gap: 8px; align-items: flex-start; margin: 20px 0 12px; cursor: pointer; }
      input[type="password"], input[type="text"] { width: 100%; box-sizing: border-box; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: inherit; font: inherit; }
      input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
      button { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; font: inherit; cursor: pointer; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #000; }
      #status { margin-top: 16px; min-height: 1.5em; }
      #status.ok { color: var(--ok); } #status.err { color: var(--err); }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p class="muted" id="intro"></p>
      <label class="row"><input type="checkbox" id="enabled" /><span id="enabledLabel"></span></label>
      <label for="key" id="keyLabel"></label>
      <input id="key" type="password" autocomplete="off" spellcheck="false" />
      <small id="saved"></small>
      <div class="buttons">
        <button class="primary" id="save"></button>
        <button id="check"></button>
        <button id="clear"></button>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script src="api-key.js"></script>
  </body>
</html>
