name: Build patched extension
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Direct https:// download link of the original Chrome extension (.crx or .zip)"
        required: true
        type: string

permissions:
  contents: read

env:
  # Patches are written against the output of this exact Prettier version. Do not change it without regenerating the patches.
  PRETTIER_VERSION: 3.9.9

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download original extension
        env:
          # Passed through the environment, never interpolated into the script.
          UPSTREAM_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          [[ $UPSTREAM_URL == https://* ]] || { echo "::error::The link must start with https://"; exit 1; }
          mkdir -p "$RUNNER_TEMP/work"
          curl -fsSL --max-time 120 -o "$RUNNER_TEMP/work/upstream.crx" -- "$UPSTREAM_URL"

      - name: Unpack
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/work"
          # A .crx is a zip with a header in front; unzip skips it with a warning (exit code 1).
          unzip -q upstream.crx -d base || [ $? -eq 1 ]
          jq -e '.name == "Kagi Translate" and .manifest_version == 3' base/manifest.json >/dev/null \
            || { echo "::error::Not the Chrome (MV3) build of Kagi Translate"; exit 1; }
          rm -rf base/_metadata # the Web Store signature is invalid once files change

      # Formatting makes the minified bundles diffable, and it is deterministic, so patch context is stable.
      - name: Format
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/work"
          npx --yes "prettier@$PRETTIER_VERSION" --parser babel --write --log-level warn "base/**/*.js"

      - name: Apply patches and overlay
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/work"
          cp -r base dist && cd dist
          for p in "$GITHUB_WORKSPACE"/patches/*.patch; do
            git apply --whitespace=nowarn "$p"
            git apply --reverse --check "$p" # guard against a silent no-op
            echo "applied ${p##*/}"
          done
          cp -r "$GITHUB_WORKSPACE"/overlay/. .

      - name: Check syntax
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/work/dist"
          find . -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Read version
        id: version
        run: echo "value=$(jq -r .version "$RUNNER_TEMP/work/dist/manifest.json")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: kagi-translate-apikey-${{ steps.version.outputs.value }}
          path: ${{ runner.temp }}/work/dist
